<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bakht book cover">
  <defs>
    <linearGradient id="bgBakht" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a0f0c"/>
      <stop offset="55%" stop-color="#5c211c"/>
      <stop offset="100%" stop-color="#7b2d26"/>
    </linearGradient>
    <radialGradient id="glowBakht" cx="50%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#c9963d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9963d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bgBakht)"/>
  <rect width="300" height="400" fill="url(#glowBakht)"/>
  <rect x="14" y="14" width="272" height="372" fill="none" stroke="#c9963d" stroke-width="1.5"/>
  <rect x="19" y="19" width="262" height="362" fill="none" stroke="#c9963d" stroke-width="0.6" opacity="0.7"/>
  <!-- corner flourishes -->
  <g stroke="#c9963d" stroke-width="1.2" fill="none" opacity="0.85">
    <path d="M14 34 h20 M14 14 v20"/>
    <path d="M286 34 h-20 M286 14 v20"/>
    <path d="M14 366 h20 M14 386 v-20"/>
    <path d="M286 366 h-20 M286 386 v-20"/>
  </g>
  <!-- compass / fate motif -->
  <g transform="translate(150,140)" stroke="#c9963d" fill="none">
    <circle r="42" stroke-width="1.3" opacity="0.9"/>
    <circle r="30" stroke-width="0.8" opacity="0.6"/>
    <g fill="#e9c988">
      <path d="M0,-42 L6,-10 L0,-2 L-6,-10 Z"/>
      <path d="M0,42 L6,10 L0,2 L-6,10 Z"/>
