      <path d="M42,0 L10,-6 L2,0 L10,6 Z"/>
    </g>
    <circle r="4.5" fill="#f3e3c3"/>
  </g>
  <line x1="90" y1="216" x2="210" y2="216" stroke="#c9963d" stroke-width="1"/>
  <text x="150" y="252" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#f3e3c3" letter-spacing="2">Bakht</text>
  <line x1="105" y1="270" x2="195" y2="270" stroke="#c9963d" stroke-width="0.8" opacity="0.8"/>
  <text x="150" y="296" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#e6ddcb">Nemrah Ahmed</text>
  <text x="150" y="352" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="10.5" letter-spacing="3" fill="#c9963d">URDU FICTION</text>
