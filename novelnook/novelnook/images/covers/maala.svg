<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Maala book cover">
  <defs>
    <linearGradient id="bgMaala" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d1f14"/>
      <stop offset="55%" stop-color="#6b3520"/>
      <stop offset="100%" stop-color="#8f4a2c"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bgMaala)"/>
  <rect x="14" y="14" width="272" height="372" fill="none" stroke="#c9963d" stroke-width="1.5"/>
  <rect x="19" y="19" width="262" height="362" fill="none" stroke="#c9963d" stroke-width="0.6" opacity="0.7"/>
  <g stroke="#c9963d" stroke-width="1.2" fill="none" opacity="0.85">
    <path d="M14 34 h20 M14 14 v20"/>
    <path d="M286 34 h-20 M286 14 v20"/>
    <path d="M14 366 h20 M14 386 v-20"/>
    <path d="M286 366 h-20 M286 386 v-20"/>
  </g>
  <!-- garland / maala motif: ring of petals -->
  <g transform="translate(150,140)">
    <circle r="44" fill="none" stroke="#c9963d" stroke-width="1" opacity="0.6"/>
    <g fill="#e9c988">
      <ellipse cx="0" cy="-44" rx="7" ry="12"/>
      <ellipse cx="31" cy="-31" rx="7" ry="12" transform="rotate(45 31 -31)"/>
      <ellipse cx="44" cy="0" rx="7" ry="12" transform="rotate(90 44 0)"/>
      <ellipse cx="31" cy="31" rx="7" ry="12" transform="rotate(135 31 31)"/>
      <ellipse cx="0" cy="44" rx="7" ry="12" transform="rotate(180 0 44)"/>
      <ellipse cx="-31" cy="31" rx="7" ry="12" transform="rotate(225 -31 31)"/>
      <ellipse cx="-44" cy="0" rx="7" ry="12" transform="rotate(270 -44 0)"/>
      <ellipse cx="-31" cy="-31" rx="7" ry="12" transform="rotate(315 -31 -31)"/>
    </g>
    <circle r="10" fill="#c9963d"/>
  </g>
  <line x1="90" y1="216" x2="210" y2="216" stroke="#c9963d" stroke-width="1"/>
  <text x="150" y="252" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#f3e3c3" letter-spacing="2">Maala</text>
  <line x1="105" y1="270" x2="195" y2="270" stroke="#c9963d" stroke-width="0.8" opacity="0.8"/>
  <text x="150" y="296" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#e6ddcb">Nimra Ahmed</text>
  <text x="150" y="352" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="10.5" letter-spacing="3" fill="#c9963d">URDU FICTION</text>
</svg>
