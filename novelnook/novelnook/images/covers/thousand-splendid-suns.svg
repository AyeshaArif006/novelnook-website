<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A Thousand Splendid Suns book cover">
  <defs>
    <linearGradient id="bgSuns" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7b2d26"/>
      <stop offset="55%" stop-color="#b06a2c"/>
      <stop offset="100%" stop-color="#c9963d"/>
    </linearGradient>
    <radialGradient id="sunburst" cx="50%" cy="34%" r="45%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="100%" stop-color="#fff3d6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bgSuns)"/>
  <rect width="300" height="400" fill="url(#sunburst)"/>
  <rect x="14" y="14" width="272" height="372" fill="none" stroke="#f3e3c3" stroke-width="1.5"/>
  <rect x="19" y="19" width="262" height="362" fill="none" stroke="#f3e3c3" stroke-width="0.6" opacity="0.6"/>
  <g stroke="#f3e3c3" stroke-width="1.2" fill="none" opacity="0.85">
    <path d="M14 34 h20 M14 14 v20"/>
    <path d="M286 34 h-20 M286 14 v20"/>
    <path d="M14 366 h20 M14 386 v-20"/>
    <path d="M286 366 h-20 M286 386 v-20"/>
  </g>
  <!-- radiating suns motif -->
  <g transform="translate(150,120)">
    <circle r="20" fill="#fff3d6"/>
    <g stroke="#fff3d6" stroke-width="2">
      <line x1="0" y1="-34" x2="0" y2="-46"/>
      <line x1="0" y1="34" x2="0" y2="46"/>
      <line x1="-34" y1="0" x2="-46" y2="0"/>
      <line x1="34" y1="0" x2="46" y2="0"/>
      <line x1="-24" y1="-24" x2="-32" y2="-32"/>
      <line x1="24" y1="-24" x2="32" y2="-32"/>
      <line x1="-24" y1="24" x2="-32" y2="32"/>
      <line x1="24" y1="24" x2="32" y2="32"/>
    </g>
    <circle cx="-62" cy="30" r="7" fill="#f3e3c3" opacity="0.85"/>
    <circle cx="66" cy="20" r="5" fill="#f3e3c3" opacity="0.8"/>
    <circle cx="52" cy="-46" r="4" fill="#f3e3c3" opacity="0.75"/>
  </g>
  <line x1="80" y1="218" x2="220" y2="218" stroke="#5c211c" stroke-width="1"/>
  <text x="150" y="246" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="15" letter-spacing="4" fill="#5c211c">A THOUSAND</text>
  <text x="150" y="278" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="700" fill="#3a1512" letter-spacing="1">Splendid Suns</text>
  <line x1="90" y1="296" x2="210" y2="296" stroke="#5c211c" stroke-width="0.8" opacity="0.75"/>
  <text x="150" y="320" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="13.5" fill="#3a1512">Khaled Hosseini</text>
  <text x="150" y="356" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="10" letter-spacing="2.5" fill="#5c211c">ENGLISH FICTION</text>
</svg>
